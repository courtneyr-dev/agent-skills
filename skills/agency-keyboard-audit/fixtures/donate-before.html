<!doctype html>
<!-- SYNTHETIC FIXTURE (Fixture Co): Client A donate page before the fix. Three keyboard defects: nav links remove the focus outline (WCAG 2.4.7), the monthly-gift switch only responds to a mouse click (2.1.1), and the amount picker traps Tab (2.1.2). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Donate to Client A (fixture)</title>
<style>
  body { font-family: system-ui, sans-serif; color: #1a1a1a; background: #ffffff; margin: 0; }
  header, main { padding: 1rem; }
  nav a { color: #0b4f8a; margin-inline-end: 1rem; }
  nav a:focus { outline: none; }
  .switch { display: inline-block; padding: 0.5rem 1rem; border: 2px solid #1a1a1a; border-radius: 1rem; cursor: pointer; }
  .switch[aria-checked="true"] { background: #0b4f8a; color: #ffffff; }
  .amounts { margin-block: 1rem; }
  .amounts button { font-size: 1rem; padding: 0.5rem 1rem; }
</style>
</head>
<body>
<header>
  <nav aria-label="Main"><a href="#about">About</a><a href="#programs">Programs</a><a href="#give">Donate</a></nav>
</header>
<main>
  <h1 id="give">Give to Client A</h1>
  <p>Every gift stocks the community pantry.</p>
  <div class="switch" id="monthly" role="switch" aria-checked="false" aria-label="Make this a monthly gift">Monthly gift</div>
  <div class="amounts" role="group" aria-label="Choose an amount">
    <button type="button" id="amount-10">$10</button>
    <button type="button" id="amount-25">$25</button>
    <button type="button" id="amount-50">$50</button>
  </div>
  <form action="#" onsubmit="return false">
    <label for="email">Email for your receipt</label>
    <input id="email" type="email" autocomplete="email">
    <button type="submit">Give now</button>
  </form>
  <h2 id="about">About</h2>
  <p>Client A runs a volunteer food pantry.</p>
  <h2 id="programs">Programs</h2>
  <p>Weekly groceries and school-break meals.</p>
</main>
<script>
  var monthly = document.getElementById("monthly");
  monthly.addEventListener("click", function () {
    monthly.setAttribute("aria-checked", String(monthly.getAttribute("aria-checked") !== "true"));
  });
  var amounts = Array.prototype.slice.call(document.querySelectorAll(".amounts button"));
  amounts.forEach(function (button, i) {
    button.addEventListener("keydown", function (event) {
      if (event.key === "Tab") {
        event.preventDefault();
        amounts[(i + (event.shiftKey ? amounts.length - 1 : 1)) % amounts.length].focus();
      }
    });
  });
</script>
</body>
</html>

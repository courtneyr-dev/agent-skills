  - replace_personal_name
  - second_person_owner
  - vault_dir_variable
  - normalize_home_path
  - genericize_vault_name
  - collapse_loop_reports_path
  - strip_para_number_prefix
  - genericize_domain
  - genericize_identifiers
  - genericize_personal_site
  - placeholder_private_example
  supporting_files:
    undeclared_canonical: excluded
    undeclared_public: blocked
    _note: Explicit allowlist. A canonical supporting file that is not declared here NEVER publishes,
      so a new private file cannot leak by appearing on disk. A PUBLIC file that is not declared is an
      error, so a stale or hand-added public file cannot hide either. Fail closed in both directions.
